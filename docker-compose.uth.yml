# UTH server production overlay.
#
# Apply with docker-compose.yml on Terra's per-user Docker daemon. The
# rootless implementation detail is intentionally not encoded in service or
# network names: the data-layer provides the standard Terra service names.
services:
  forecaster:
    labels:
      io.portainer.accesscontrol.teams: terra-team
    networks:
      - terra-network
    environment:
      MINIO_ENDPOINT: http://terra-minio:9000
      MINIO_VERIFY_TLS: "false"

  forecaster-api:
    labels:
      io.portainer.accesscontrol.teams: terra-team
    networks:
      - terra-network
    environment:
      MINIO_ENDPOINT: http://terra-minio:9000
      MINIO_VERIFY_TLS: "false"

  forecaster-api-output-init:
    labels:
      io.portainer.accesscontrol.teams: terra-team

volumes:
  forecaster-api-output:
    labels:
      io.portainer.accesscontrol.teams: terra-team

networks:
  terra-network:
    external: true
    name: terra-network
