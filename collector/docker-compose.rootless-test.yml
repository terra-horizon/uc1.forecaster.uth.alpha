services:
  collector:
    # The inherited host bind mount targets an iprism-owned directory. A
    # rootless container's non-root user maps to a subordinate host UID, so
    # use a private rootless volume for disposable collector run artifacts.
    volumes:
      - terra-rootless-collector-output:/app/outputs
    networks:
      - terra-rootless
    environment:
      # Pre-proxy-cutover integration tests must target Terra's rootless
      # MinIO service directly, not the public endpoint still served by the
      # rootful proxy.
      MINIO_ENDPOINT: http://terra-minio:9000
      MINIO_VERIFY_TLS: "false"

networks:
  terra-rootless:
    external: true
    name: terra-rootless-network

volumes:
  terra-rootless-collector-output:
