# Permanent overlay for the Terra rootless Docker daemon.
#
# Use with the base file only on the Terra host:
#   docker compose -f docker-compose.yml -f docker-compose.rootless.yml ...
# The data-layer Compose project provides this external network and exposes the
# stable service names terra-mongodb and terra-minio inside it.
services:
  forecaster:
    networks:
      - terra-rootless
    environment:
      MINIO_ENDPOINT: http://terra-minio:9000
      MINIO_VERIFY_TLS: "false"

networks:
  terra-rootless:
    external: true
    name: terra-rootless-network
